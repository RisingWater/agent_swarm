version: "3.8"

# agent_swarm 单服务编排：管理前端 + API + MCP 同端口 :8700
# 用法:
#   docker compose -f docker/compose.yaml up -d        # 拉取 GHCR 镜像启动
#   docker compose -f docker/compose.yaml logs -f
#   docker compose -f docker/compose.yaml down
#
# 镜像由 GitHub Actions 自动构建推送（.github/workflows/docker-image.yml）；
# 本地开发自行构建时取消 build 注释并注释 image 行

services:
  agent-swarm:
    # 默认拉 GHCR 镜像（GitHub Actions 自动构建）；本地开发想自己构建时：
    #   docker compose -f docker/compose.yaml build
    image: ghcr.io/risingwater/agent_swarm:dev
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: agent-swarm
    restart: unless-stopped
    ports:
      - "8700:8700"
    environment:
      # 生产环境务必改成随机长字符串
      AGENT_SWARM_JWT_SECRET: ${AGENT_SWARM_JWT_SECRET:-agent-swarm-dev-secret-change-me}
      # 静态内容落库加密（推荐）：设置后敏感内容密文落库；密钥丢失=加密历史永久不可读，务必备份
      # AGENT_SWARM_ENC_KEY: ${AGENT_SWARM_ENC_KEY:-}
      # 恢复密钥（可选，与主密钥分开保存）：主密钥丢失时的解密兜底
      # AGENT_SWARM_ENC_KEY_RECOVERY: ${AGENT_SWARM_ENC_KEY_RECOVERY:-}
      # 有公网域名/反代时设置，注入到 /download/install.* 的服务地址
      # AGENT_SWARM_PUBLIC_URL: https://swarm.example.com
    volumes:
      - agent-swarm-data:/app/data

volumes:
  agent-swarm-data:

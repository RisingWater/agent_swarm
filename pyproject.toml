[project]
name = "agent-swarm"
version = "0.1.0"
description = "Multi-agent communication hub: MCP server + management web + opencode plugin"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.2",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "pyjwt>=2.8",
    "shortuuid>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

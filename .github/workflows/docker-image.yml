# 构建服务端 Docker 镜像并推送到 GHCR（GitHub Container Registry，GitHub 官方镜像仓库）。
#
# 触发：
# - push 到 dev 分支 → ghcr.io/risingwater/agent-swarm:dev
# - push tag v*      → ghcr.io/risingwater/agent-swarm:v1.2.3 + :latest
# - 手动触发（workflow_dispatch）
#
# 镜像拉取（服务器上）:
#   docker pull ghcr.io/risingwater/agent-swarm:dev
# 私有仓库首次拉取需登录：
#   echo <GITHUB_TOKEN> | docker login ghcr.io -u <用户名> --password-stdin

name: docker-image

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta（tags/labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
